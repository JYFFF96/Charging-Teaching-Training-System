<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫码充电</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#183047;font-family:system-ui,sans-serif}header{background:#12374b;color:white;padding:26px 22px}header small{color:#9fd8d5}main{max-width:480px;margin:auto;padding:20px}.card{background:white;padding:24px;border-radius:20px;box-shadow:0 8px 30px #16354a08;margin-bottom:16px}h1{font-size:26px;margin:8px 0}h2{font-size:22px}p{line-height:1.6}.notice{background:#fff4dc;padding:12px;border-radius:12px;font-size:13px}label{display:block;font-size:14px;margin:16px 0 7px}input,select,button{width:100%;font:inherit;border-radius:10px;padding:13px}input,select{border:1px solid #d8e2ea;background:white}button{border:0;background:#087f83;color:white;font-weight:600;margin-top:18px;cursor:pointer}button.secondary{background:#eaf3f3;color:#08686b}button.danger{background:#b74444}button:disabled{opacity:.5}nav{display:flex;gap:8px}nav button{font-size:14px}dl{display:grid;grid-template-columns:1fr 1fr;gap:14px}dt{color:#6d7e8e}dd{text-align:right;margin:0;overflow-wrap:anywhere}#message{color:#a73824;min-height:20px}a{color:#087f83}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#f2f7f8;padding:16px;border-radius:12px}.metric strong{display:block;font-size:25px;margin-top:8px}footer{text-align:center;color:#718293;font-size:12px;padding:20px}.hidden{display:none}
</style></head><body><header><small>客户充电服务</small><h1>扫码充电</h1><span>连接设备，轻松充电</span></header><main><div class="notice">演示模式 · 不创建真实账号，不发送设备命令，不收取费用。请使用虚构信息。</div><p id="context"></p><div id="view"></div><p id="message" role="status" aria-live="polite"></p></main><footer>充电教学与实训系统 · 客户端第一版</footer><script>
'use strict';
const query=new URLSearchParams(location.search);
const pile=query.get('pile_no')||'';const gun=query.get('gun_no')||'1';
const valid=/^\d{14}$/.test(pile)&&/^([1-9]|[1-9]\d)$/.test(gun);
const view=document.getElementById('view'),message=document.getElementById('message');
document.getElementById('context').textContent=valid?`当前设备：${pile} / ${gun}号枪`:'未获取有效设备信息，请扫描带桩号和枪号的二维码。';
let user='',page='login',timer=null,seconds=0,order=null;
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(name,label,type='text',extra='')=>`<label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" required ${extra}>`;
function show(p){page=p;message.textContent='';render();}
function render(){
 if(['login','register','recover'].includes(page)){
 const titles={login:'欢迎登录',register:'创建账号',recover:'找回密码'};
 view.innerHTML=`<section class="card"><h2>${titles[page]}</h2><p>登录后继续处理刚扫描的设备。</p><form id="auth">${field('account','账号','text','minlength="4" maxlength="32" autocomplete="username" pattern="[A-Za-z0-9_]{4,32}"')}${page==='recover'?'':field('password','密码','password',`minlength="8" maxlength="128" autocomplete="${page==='login'?'current-password':'new-password'}"`)}${page==='register'?field('confirm','确认密码','password','minlength="8" autocomplete="new-password"'):''}${page!=='login'?'<label for="question">安全问题</label><select id="question" name="question"><option>你为自己设定的秘密口令是什么？</option><option>你最喜欢的虚构人物是谁？</option><option>你童年最难忘的一件事是什么？</option></select>'+field('answer','安全答案','password','minlength="2" maxlength="128" autocomplete="off"'):''}${page==='recover'?field('newpassword','新密码','password','minlength="8" autocomplete="new-password"')+field('confirm','确认新密码','password','minlength="8" autocomplete="new-password"'):''}<p><small>账号为4–32位字母、数字或下划线；密码至少8位。</small></p><button>${page==='login'?'演示登录':page==='register'?'演示注册':'演示重置密码'}</button></form><nav><button class="secondary" data-page="login">登录</button><button class="secondary" data-page="register">注册</button><button class="secondary" data-page="recover">忘记密码</button></nav></section>`;
 document.getElementById('auth').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),pwd=f.get('password')||f.get('newpassword');if(page!=='login'&&pwd!==f.get('confirm')){message.textContent='两次输入的密码不一致';return;}if(page==='recover'){show('login');message.textContent='演示流程完成，未修改任何真实账号。';return;}user=f.get('account');e.target.reset();show('device');};
 }else if(page==='device'){
 view.innerHTML=`<section class="card"><h2>确认充电设备</h2><p>你好，${escape(user)}</p><dl><dt>桩编号</dt><dd>${escape(pile||'未识别')}</dd><dt>枪号</dt><dd>${escape(gun)}</dd><dt>状态</dt><dd>${valid?'模拟空闲 · 已插枪':'设备信息无效'}</dd><dt>演示电费</dt><dd>0.80 元/kWh</dd><dt>演示服务费</dt><dd>0.40 元/kWh</dd></dl><p>实际价格及设备状态以后台返回为准。</p><button id="start" ${valid?'':'disabled'}>开始演示充电</button><button class="secondary" data-page="orders">我的演示订单</button><button class="secondary" id="logout">退出登录</button></section>`;
 document.getElementById('start').onclick=()=>{if(order&&order.status==='charging'){show('charging');return;}seconds=0;order={id:'DEMO-'+Date.now(),status:'charging',energy:0,amount:0};show('charging');timer=setInterval(()=>{seconds++;order.energy=seconds/360;order.amount=order.energy*1.2;if(page==='charging')update();},1000);};
 document.getElementById('logout').onclick=()=>{if(order?.status==='charging'){message.textContent='请先结束演示充电';return;}user='';show('login');};
 }else if(page==='charging'){
 view.innerHTML='<section class="card"><h2>演示充电中</h2><p>数据由本页面模拟生成。</p><div class="metrics"><div class="metric">时间<strong id="duration"></strong></div><div class="metric">电量 / kWh<strong id="energy"></strong></div><div class="metric">金额 / 元<strong id="amount"></strong></div><div class="metric">设备状态<strong>模拟充电</strong></div></div><button class="danger" id="stop">停止演示充电</button></section>';update();document.getElementById('stop').onclick=()=>{clearInterval(timer);timer=null;order.status='finished';show('result');};
 }else if(page==='result'){
 view.innerHTML=`<section class="card"><h2>演示充电已结束</h2><dl><dt>电量</dt><dd>${order.energy.toFixed(4)} kWh</dd><dt>模拟金额</dt><dd>${order.amount.toFixed(2)} 元</dd></dl><p>未实际扣款，未生成真实交易。</p><button data-page="device">返回设备</button><button class="secondary" data-page="orders">查看演示订单</button></section>`;
 }else{
 view.innerHTML=`<section class="card"><h2>我的演示订单</h2>${order?`<p>${escape(order.id)}</p><p>${order.status==='charging'?'模拟充电中':'模拟已结束'} · ${order.amount.toFixed(2)} 元</p><button data-page="${order.status==='charging'?'charging':'result'}">查看详情</button>`:'<p>暂无演示订单</p>'}<button class="secondary" data-page="device">返回设备</button><p><small>演示订单仅在当前页面内存中，刷新后清空。</small></p></section>`;
 }
 view.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
}
function update(){document.getElementById('duration').textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');document.getElementById('energy').textContent=order.energy.toFixed(4);document.getElementById('amount').textContent=order.amount.toFixed(2);}
render();
</script></body></html>
