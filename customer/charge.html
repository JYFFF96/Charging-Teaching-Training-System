<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>扫码充电</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#183047;font-family:system-ui,sans-serif}header{background:#12374b;color:white;padding:26px 22px}header small{color:#9fd8d5}main{max-width:480px;margin:auto;padding:20px}.card{background:white;padding:24px;border-radius:20px;box-shadow:0 8px 30px #16354a08;margin-bottom:16px}h1{font-size:26px;margin:8px 0;color:#9fd8d5}h2{font-size:22px}p{line-height:1.6}.notice{background:#fff4dc;padding:12px;border-radius:12px;font-size:13px}label{display:block;font-size:14px;margin:16px 0 7px}input,select,button{width:100%;font:inherit;border-radius:10px;padding:13px}input,select{border:1px solid #d8e2ea;background:white}button{border:0;background:#087f83;color:white;font-weight:600;margin-top:18px;cursor:pointer}button.secondary{background:#eaf3f3;color:#08686b}button.danger{background:#b74444}button:disabled{opacity:.5}nav{display:flex;gap:8px}nav button{font-size:14px}dl{display:grid;grid-template-columns:1fr 1fr;gap:14px}dt{color:#6d7e8e}dd{text-align:right;margin:0;overflow-wrap:anywhere}#message{color:#a73824;min-height:20px}a{color:#087f83}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#f2f7f8;padding:16px;border-radius:12px}.metric strong{display:block;font-size:25px;margin-top:8px}footer{text-align:center;color:#718293;font-size:12px;padding:20px}.hidden{display:none}
.order-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.order-table th{text-align:left;color:#6d7e8e;font-weight:500;background:#f2f7f8}.order-table th,.order-table td{padding:13px 5px;border-bottom:1px solid #e6edef;vertical-align:middle;overflow-wrap:anywhere}.order-table th:nth-child(1){width:23%}.order-table th:nth-child(2){width:31%}.order-table th:nth-child(3){width:25%}.order-table th:nth-child(4){width:21%;text-align:right}.order-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}.order-table tbody tr{cursor:pointer}.order-table tbody tr:hover,.order-table tbody tr:focus-visible{background:#eaf6f5;outline:2px solid #087f83;outline-offset:-2px}.order-table small{display:block;color:#718293;margin-top:4px}.order-status{color:#087f83}.order-status.failed{color:#b74444}.order-hint{font-size:12px;color:#718293}@media(max-width:360px){.order-table{font-size:12px}.order-table th,.order-table td{padding:11px 3px}}
</style></head><body><header><h1>智学客充电教学实训平台</h1><span>连接设备，轻松充电</span></header><main><p id="context"></p><div id="view"></div><p id="message" role="status" aria-live="polite"></p></main><footer>充电教学与实训系统 · 客户账号版</footer><script>
'use strict';
const query=new URLSearchParams(location.search);
const pile=query.get('pile_no')||'';const gun=query.get('gun_no')||'1';
const valid=/^\d{14}$/.test(pile)&&/^([1-9]|[1-9]\d)$/.test(gun);
const view=document.getElementById('view'),message=document.getElementById('message');
document.getElementById('context').textContent=valid?`当前设备：${pile} / ${gun}号枪`:'未获取有效设备信息，请扫描带桩号和枪号的二维码。';
let user='',page='login',order=null,device=null,wallet=null,orders=[],busy=false,polling=false,reserveAmount='100';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(name,label,type='text',extra='')=>`<label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" required ${extra}>`;
function show(p){page=p;message.textContent='';render();if(user&&['device','charging','orders','wallet'].includes(p))refresh();}
function render(){
 if(['login','register','recover'].includes(page)){
 const titles={login:'欢迎登录',register:'创建账号',recover:'找回密码'};
 view.innerHTML=`<section class="card"><h2>${titles[page]}</h2><p>登录后继续处理刚扫描的设备。新注册账号赠送1000元余额。</p><form id="auth">${field('account','账号','text','minlength="4" maxlength="32" autocomplete="username" pattern="[A-Za-z0-9_]{4,32}"')}${page==='recover'?'':field('password','密码','password',`minlength="8" maxlength="128" autocomplete="${page==='login'?'current-password':'new-password'}"`)}${page==='register'?field('confirm','确认密码','password','minlength="8" autocomplete="new-password"'):''}${page!=='login'?'<label for="question">安全问题</label><select id="question" name="question"><option value="movie">你最喜欢的电影是哪一部？</option><option value="book">你最喜欢的一本书是什么？</option><option value="color">你最喜欢的颜色是什么？</option><option value="sport">您最喜欢的运动是什么？</option><option value="disliked_food">你最讨厌的食物是什么？</option><option value="first_phone_last4">你的第一个手机号码后四位是多少？</option><option value="respected_person">您最尊敬的人是谁？</option><option value="favorite_number">您最喜欢的数字是多少？</option>'+'</select>'+field('answer','安全答案','password','minlength="1" maxlength="128" autocomplete="off"'):''}${page==='recover'?field('newpassword','新密码','password','minlength="8" autocomplete="new-password"')+field('confirm','确认新密码','password','minlength="8" autocomplete="new-password"'):''}<p><small>账号为4–32位字母、数字或下划线；密码至少8位。</small></p><button>${page==='login'?'登录':page==='register'?'注册并登录':'验证并重置密码'}</button></form><nav><button class="secondary" data-page="login">登录</button><button class="secondary" data-page="register">注册</button><button class="secondary" data-page="recover">忘记密码</button></nav></section>`;
 document.getElementById('auth').onsubmit=async e=>{
 e.preventDefault();const form=e.target,f=new FormData(form),current=page,pwd=f.get('password')||f.get('newpassword');
 if(current!=='login'&&pwd!==f.get('confirm')){message.textContent='两次输入的密码不一致';return;}
 form.querySelector('button').disabled=true;
 const payload={username:f.get('account'),password:pwd,security_question_id:f.get('question'),security_answer:f.get('answer')};
 try{
 if(current==='recover'){
 const proof=await api('/recovery/verify',payload);
 await api('/recovery/reset',{reset_token:proof.reset_token,new_password:pwd});
 user='';order=null;wallet=null;device=null;orders=[];form.reset();show('login');message.textContent='密码已重置，请使用新密码登录。';return;
 }
 const data=await api('/'+current,payload);user=data.user.username;form.reset();show('device');
 }catch(error){message.textContent=error.message;}finally{if(form.isConnected)form.querySelector('button').disabled=false;}
 };
 }else if(page==='device'){
 const state=device?.availability||'loading';
 const labels={loading:'正在查询设备',idle:'空闲',occupied:'该枪正在使用中',offline:'设备离线',fault:'设备故障',unknown:'等待最新设备数据',mine:'本人订单',account_busy:'您有未结束的充电订单'};
 const plugged=device?.latest?.gun_plugged===1;
 const rates=device?.billing?.rates;
 view.innerHTML=`<section class="card"><h2>确认充电设备</h2><p>你好，${escape(user)}</p>${walletInfo()}<dl><dt>桩编号</dt><dd>${escape(pile||'未识别')}</dd><dt>枪号</dt><dd>${escape(gun)}</dd><dt>设备状态</dt><dd>${escape(valid?labels[state]:'请从桩二维码进入')}</dd><dt>插枪状态</dt><dd>${state==='idle'?(plugged?'已插枪':'未插枪'):'—'}</dd></dl>${device?.message?`<p role="status">${escape(device.message)}</p>`:''}${device?.active_order?`<p>当前订单：${escape(device.active_order.pile_no)} / ${escape(device.active_order.gun_no)}号枪</p><button id="currentOrder">查看当前充电</button>`:''}${rates?'<p>后台计费模型（元/kWh）</p>'+Object.entries(rates).map(([key,v])=>`<p>${({jian:'尖',feng:'峰',ping:'平',gu:'谷'})[key]}：电费 ${Number(v.electricity).toFixed(2)} + 服务费 ${Number(v.service).toFixed(2)}</p>`).join(''):''}<p>每轮充电结束后，必须先拔枪再重新插枪，才能开始下一轮。<br>预留金额由你设置，仅冻结额度，结束后按最终账单扣费，多余预留自动释放，启动失败不扣费。</p><label for="reserveAmount">预留金额（元）</label><input id="reserveAmount" type="number" min="0.01" max="${wallet?Math.min(wallet.available_fen,4294967295)/100:100}" step="0.01" value="${escape(reserveAmount)}" inputmode="decimal" required><p><small>默认100元，不能超过可用余额。</small></p><button id="start" ${!valid||state!=='idle'||!plugged||busy||!wallet||wallet.available_fen<=0?'disabled':''}>确认并启动充电</button><button class="secondary" id="refreshDevice" ${busy?'disabled':''}>刷新状态</button><button class="secondary" data-page="orders">我的订单</button><button class="secondary" data-page="wallet">钱包</button><button class="secondary" id="logout">退出登录</button></section>`;
 document.getElementById('refreshDevice').onclick=()=>refresh();
 if(device?.active_order)document.getElementById('currentOrder').onclick=()=>{order=device.active_order;show('charging');};
 document.getElementById('reserveAmount').oninput=e=>{reserveAmount=e.target.value;};
 document.getElementById('start').onclick=()=>{const input=document.getElementById('reserveAmount');if(!input.reportValidity())return;reserveAmount=input.value;action(async()=>{const d=await api('/orders',{pile_no:pile,gun_no:Number(gun),reserve_amount:reserveAmount});order=d.order;page='charging';});};
 logoutButton();
 }else if(page==='charging'){
 if(!order){view.innerHTML='<section class="card">正在恢复订单…</section>';return;}
 const d=order.latest||{},tx=order.transaction;
 const failed=order.status==='failed';
 const connection=order.device_online===true?'在线':order.device_online===false?'离线':'连接状态待更新';
 const deviceLabel=({idle:'空闲',charging:'充电中',offline:'离线',fault:'故障',unknown:'等待设备状态更新'})[order.device_state]||'等待设备状态更新';
 const names={starting:'正在启动',charging:'充电中',stopping:'正在停止',ending:'等待最终交易记录',unknown:'结果待确认',finished:'充电结束',failed:'启动失败'};
 const energy=tx?Number(tx.total_energy)/10000:(d.energy===undefined?null:Number(d.energy)/10000);
 const amount=tx?Math.floor((Number(tx.total_amount)+50)/100)/100:(d.amount===undefined?null:Math.floor((Number(d.amount)+50)/100)/100);
 view.innerHTML=`<section class="card"><h2>${escape(names[order.status]||order.status)}</h2><p>${escape(order.pile_no)} / ${order.gun_no}号枪</p><p role="status" style="color:${order.status==='failed'?'#b74444':'inherit'}">${escape(order.note||'')}</p>${failed?'<p>本次启动失败，未扣费。请处理上述问题后点击“重新尝试充电”。</p>':''}<div class="metrics"><div class="metric">电量 / kWh<strong>${energy===null?'—':energy.toFixed(4)}</strong></div><div class="metric">设备金额 / 元<strong>${amount===null?'—':amount.toFixed(2)}</strong></div><div class="metric">充电时间 / 分钟<strong>${d.charge_time??'—'}</strong></div><div class="metric">SOC / %<strong>${d.soc??'—'}</strong></div></div><p>设备连接：${connection} · 设备状态：${escape(deviceLabel)}</p><p><small>${failed?'本次未成功启动，暂无本次充电数据。':'空白数据表示尚未取得匹配订单的最新报文。'}</small></p><dl><dt>订单编号</dt><dd>${escape(order.serial_no||order.id||'—')}</dd><dt>创建时间</dt><dd>${orderTime(order.created_at)}</dd>${tx?`<dt>开始时间</dt><dd>${escape(tx.start_time||'—')}</dd><dt>结束时间</dt><dd>${escape(tx.end_time||'—')}</dd>`:''}</dl>${tariffDetails(tx)}${walletInfo()}${failed?'':`<p>${order.settlement_status==='settled'?'已扣费：'+money(order.settled_fen)+' 元':order.settlement_status==='review'?'账单金额变更待核查，未重复扣费':order.settlement_status==='not_charged'?'启动失败，未扣费':order.settlement_status==='legacy'?'历史订单不追扣余额':'等待最终账单后扣费'}。</p>`}${failed?`<button id="retry" ${busy?'disabled':''}>重新尝试充电</button>`:''}${order.status==='charging'?`<button class="danger" id="stop" ${busy||order.status!=='charging'||order.device_state!=='charging'?'disabled':''}>停止本人充电</button>`:''}<button class="secondary" data-page="orders">我的订单</button><button class="secondary" data-page="wallet">钱包</button><button class="secondary" data-page="device">返回当前扫码设备</button></section>`;
 if(failed)document.getElementById('retry').onclick=()=>{if(busy)return;if(order.pile_no!==pile||Number(order.gun_no)!==Number(gun)){location.href='/?pile_no='+encodeURIComponent(order.pile_no)+'&gun_no='+encodeURIComponent(order.gun_no);return;}device=null;show('device');};
 if(order.status==='charging')document.getElementById('stop').onclick=()=>action(async()=>{const d=await api('/orders/'+order.id+'/stop',{});order=d.order;});
 }else if(page==='wallet'){
 view.innerHTML=`<section class="card"><h2>钱包</h2>${walletInfo()}<p>余额仅用于教学模拟，不可提现。充值或扣费请联系管理员。开始充电预留额度；最终账单到账后结算。</p>${wallet?.ledger?.length?wallet.ledger.map(entry=>`<p>${escape(ledgerName(entry.kind))} · ${entry.delta_fen>=0?'+':''}${money(entry.delta_fen)} 元<br><small>${escape(new Date(entry.created*1000).toLocaleString())} · ${escape(entry.note)}<br>变动后余额：${money(entry.after_fen)} 元</small></p>`).join(''):'<p>暂无流水</p>'}<button class="secondary" data-page="device">返回设备</button><button class="secondary" data-page="orders">我的订单</button><button class="secondary" id="logout">退出登录</button></section>`;logoutButton();
 }else{
 view.innerHTML=`<section class="card"><h2>我的订单</h2>${walletInfo()}${orders.length?`<p class="order-hint">点击任意一行查看订单详情 · 最近${orders.length}笔</p><table class="order-table"><thead><tr><th scope="col">时间</th><th scope="col">设备</th><th scope="col">状态</th><th scope="col">费用/元</th></tr></thead><tbody>${orders.map(o=>`<tr tabindex="0" data-order="${escape(o.id)}" aria-label="查看${escape(o.pile_no)} ${escape(o.gun_no)}号枪订单详情"><td>${orderTime(o.created_at)}</td><td>${escape(o.pile_no)}<small>${escape(o.gun_no)}号枪</small></td><td><span class="order-status ${o.status==='failed'?'failed':''}">${escape(({starting:'正在启动',charging:'充电中',stopping:'正在停止',unknown:'结果待确认',ending:'等待账单',finished:'已结束',failed:'启动失败'})[o.status]||o.status)}</span><small>${escape(tariffSummary(o.transaction))}</small></td><td>${orderCost(o)}</td></tr>`).join('')}</tbody></table>`:'<p>暂无订单</p>'}<button class="secondary" data-page="device">返回当前扫码设备</button><button class="secondary" id="logout">退出登录</button></section>`;
 view.querySelectorAll('[data-order]').forEach(row=>{const open=()=>{order=orders.find(o=>o.id===row.dataset.order);show('charging');};row.onclick=open;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});logoutButton();
 }
 view.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
}
function logoutButton(){document.getElementById('logout').onclick=()=>action(async()=>{await api('/logout',{});user='';order=null;device=null;wallet=null;orders=[];page='login';});}
async function action(fn){if(busy)return;busy=true;message.textContent='正在处理，请等待设备回复…';render();try{await fn();if(user){const w=await api('/wallet');wallet=w.wallet;}message.textContent='';}catch(error){message.textContent=error.message;}finally{busy=false;render();}}
function money(fen){return (Number(fen||0)/100).toFixed(2);}
const tariffKinds=[['jian','尖'],['feng','峰'],['ping','平'],['gu','谷']];
function tariffNumber(tx,key,scale,digits){return tx&&tx[key]!=null&&Number.isFinite(Number(tx[key]))?(Number(tx[key])/scale).toFixed(digits):'—';}
function tariffSummary(tx){if(!tx)return '计费类型待账单确认';if(!tariffKinds.some(([key])=>tx[key+'_energy']!=null||tx[key+'_amount']!=null))return '账单缺少分时数据';const used=tariffKinds.filter(([key])=>Number(tx[key+'_energy'])>0||Number(tx[key+'_amount'])>0);return used.length?used.map(([key,label])=>label+' '+tariffNumber(tx,key+'_price',100000,2)+'元/度').join('、'):'账单无分时用量';}
function tariffDetails(tx){if(!tx)return '<p class="order-hint">分时计费明细待最终账单确认。</p>';return `<h3>分时计费明细</h3><p class="order-hint">单价含电费及服务费，以设备上传账单为准。</p><table class="order-table"><thead><tr><th scope="col">类型</th><th scope="col">单价<br>元/度</th><th scope="col">电量<br>kWh</th><th scope="col">费用<br>元</th></tr></thead><tbody>${tariffKinds.map(([key,label])=>`<tr><td>${label}</td><td>${tariffNumber(tx,key+'_price',100000,2)}</td><td>${tariffNumber(tx,key+'_energy',10000,4)}</td><td>${tx[key+'_amount']==null?'—':money(Math.floor((Number(tx[key+'_amount'])+50)/100))}</td></tr>`).join('')}</tbody></table><p class="order-hint">各时段费用单独四舍五入，与账单总额可能存在分位差异；余额按最终账单总额结算。</p>`;}
function orderTime(seconds){const date=new Date(Number(seconds)*1000);if(!seconds||Number.isNaN(date.getTime()))return '—';const pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}<small>${pad(date.getHours())}:${pad(date.getMinutes())}</small>`;}
function orderCost(o){if(o.settlement_status==='settled'&&o.settled_fen!=null)return money(o.settled_fen);if(o.settlement_status==='not_charged')return '0.00';if(o.transaction?.total_amount!=null)return money(Math.floor((Number(o.transaction.total_amount)+50)/100));return '—';}
function walletInfo(){return wallet?`<p><b>余额：${money(wallet.balance_fen)} 元</b><br>可用：${money(wallet.available_fen)} 元 · 预留：${money(wallet.reserved_fen)} 元</p>`:'<p>正在读取余额…</p>';}
function ledgerName(kind){return ({bonus:'赠送余额',admin_credit:'管理员充值',admin_debit:'管理员扣费',charging:'充电扣费'})[kind]||kind;}
async function refresh(){
 if(!user||busy||polling)return;polling=true;const current=page;
 try{
 const w=await api('/wallet');if(!user)return;wallet=w.wallet;
 if(page==='device'&&valid){const d=await api('/device?pile_no='+encodeURIComponent(pile)+'&gun_no='+encodeURIComponent(gun));if(page!==current)return;device=d;if(d.availability==='mine'){order=d.order;page='charging';}}
 else if(page==='charging'&&order){const d=await api('/orders/'+order.id);if(page!==current)return;order=d.order;}
 else if(page==='orders'){const d=await api('/orders');if(page!==current)return;orders=d.orders;}
 if(!busy&&!(page==='device'&&document.activeElement?.id==='reserveAmount'))render();
 }catch(error){if(error.status===401){user='';order=null;wallet=null;device=null;orders=[];page='login';render();}message.textContent=error.message;}finally{polling=false;}
}

async function api(path,payload){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),100000);
 try{
 const response=await fetch('/api/customer'+path,{method:payload===undefined?'GET':'POST',credentials:'same-origin',headers:payload===undefined?{}:{'Content-Type':'application/json','X-Customer-Request':'1'},body:payload===undefined?undefined:JSON.stringify(payload),signal:controller.signal});
 const data=await response.json();if(!response.ok){const error=new Error(data.error||'请求失败');error.status=response.status;throw error;}return data;
 }catch(error){if(error.name==='AbortError')throw new Error('请求超时，请稍后重试');if(error instanceof SyntaxError||error instanceof TypeError)throw new Error('客户接口不可用，请确认已启动新版客户服务');throw error;}finally{clearTimeout(timeout);}
}
async function init(){
 render();
 try{await api('/config');}catch(error){message.textContent=error.message;return;}
 try{const data=await api('/me');user=data.user.username;show('device');}catch(error){if(error.message!=='请先登录')message.textContent=error.message;}
}
init();
setInterval(()=>{if(!document.hidden)refresh();},5000);
</script></body></html>
