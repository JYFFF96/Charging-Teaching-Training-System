<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>交直流一体化实训系统</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f8;color:#183047;font-family:system-ui,sans-serif}header{background:#12374b;color:white;padding:26px 22px}header small{color:#9fd8d5}main{max-width:480px;margin:auto;padding:20px}.card{background:white;padding:24px;border-radius:20px;box-shadow:0 8px 30px #16354a08;margin-bottom:16px}h1{font-size:26px;margin:8px 0;color:#9fd8d5}h2{font-size:22px}p{line-height:1.6}.notice{background:#fff4dc;padding:12px;border-radius:12px;font-size:13px}label{display:block;font-size:14px;margin:16px 0 7px}input,select,button{width:100%;font:inherit;border-radius:10px;padding:13px}input,select{border:1px solid #d8e2ea;background:white}button{border:0;background:#087f83;color:white;font-weight:600;margin-top:18px;cursor:pointer}button.secondary{background:#eaf3f3;color:#08686b}button.danger{background:#b74444}button:disabled{opacity:.5}nav{display:flex;gap:8px}nav button{font-size:14px}dl{display:grid;grid-template-columns:1fr 1fr;gap:14px}dt{color:#6d7e8e}dd{text-align:right;margin:0;overflow-wrap:anywhere}#message{color:#a73824;min-height:20px}a{color:#087f83}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.metric{background:#f2f7f8;padding:16px;border-radius:12px}.metric strong{display:block;font-size:25px;margin-top:8px}footer{text-align:center;color:#718293;font-size:12px;padding:20px}.hidden{display:none}
.order-table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}.order-table th{text-align:left;color:#6d7e8e;font-weight:500;background:#f2f7f8}.order-table th,.order-table td{padding:13px 5px;border-bottom:1px solid #e6edef;vertical-align:middle;overflow-wrap:anywhere}.order-table th:nth-child(1){width:23%}.order-table th:nth-child(2){width:31%}.order-table th:nth-child(3){width:25%}.order-table th:nth-child(4){width:21%;text-align:right}.order-table td:last-child{text-align:right;font-variant-numeric:tabular-nums}.order-table tbody tr{cursor:pointer}.order-table tbody tr:hover,.order-table tbody tr:focus-visible{background:#eaf6f5;outline:2px solid #087f83;outline-offset:-2px}.order-table small{display:block;color:#718293;margin-top:4px}.order-status{color:#087f83}.order-status.failed{color:#b74444}.order-hint{font-size:12px;color:#718293}@media(max-width:360px){.order-table{font-size:12px}.order-table th,.order-table td{padding:11px 3px}}

body.charge-screen header,body.charge-screen #context,body.charge-screen footer{display:none}body.charge-screen main{padding:0 14px 24px;max-width:480px}.charge-head{margin:0 -14px 14px;padding:18px 20px;background:linear-gradient(120deg,#55bba9,#358d81);color:white}.charge-head h2{margin:0 0 5px;font-size:22px}.charge-head p{font-size:12px;margin:0;overflow-wrap:anywhere;opacity:.95}.charge-safety{background:#fff9e5;border-left:4px solid #ffbd3e;border-radius:10px;padding:12px 14px;color:#86551d;font-size:12px;line-height:1.8}.charge-safety strong{display:block;color:#d67613;font-size:13px}.soc-wrap{position:relative;width:190px;height:190px;margin:20px auto}.soc-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}.soc-wrap circle{fill:none;stroke-width:10}.soc-track{stroke:#e0e6e6}.soc-progress{stroke:#51bba6;stroke-linecap:round;transition:stroke-dashoffset .5s}.soc-value{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column}.soc-value strong{font-size:44px;color:#51bba6}.soc-value span{font-size:13px;color:#80909e}.charge-rate{text-align:center;font-size:12px;margin-bottom:14px;line-height:1.8}.charge-rate b{color:#c87455;background:#fff0e9;border-radius:5px;padding:3px 6px;margin-right:5px}.charge-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.charge-tile{background:white;border-radius:12px;padding:14px 4px;text-align:center;box-shadow:0 2px 6px #18304705}.charge-tile strong{display:block;font-size:22px}.charge-tile span{display:block;font-size:10px;color:#92a1ad;margin:3px 0}.charge-tile small{font-size:11px;color:#657584}.charge-panel{background:white;border-radius:15px;padding:18px;margin-top:14px;box-shadow:0 3px 10px #18304705}.charge-panel h3{margin:0 0 12px;font-size:16px}.charge-panel p{margin:6px 0;font-size:12px;color:#718293}.charge-panel dl{margin:0;font-size:13px}.charge-panel dd{font-variant-numeric:tabular-nums}.charge-total{border-top:1px solid #edf0f3;margin-top:14px;padding-top:14px;display:flex;justify-content:space-between;font-size:14px}.charge-total strong{color:#41ad99;font-size:22px}.charge-stop{border-radius:28px;background:linear-gradient(110deg,#ed665d,#ce4337);margin-top:18px;font-size:17px;padding:16px}.charge-chart{width:100%;height:auto;display:block}.chart-empty{text-align:center;padding:32px 0;color:#8b9ba7;font-size:13px}.charge-meta{overflow-wrap:anywhere}.charge-nav{display:flex;gap:8px}.charge-nav button{font-size:13px}.charge-note{font-size:12px;color:#8a631d;margin:12px 0;line-height:1.7}

body.login-screen{background:#f3f6f5;color:#182923;min-height:100svh;display:flex;flex-direction:column}body.login-screen header{background:linear-gradient(115deg,#193c32,#316d58);padding:26px max(24px,calc((100% - 432px)/2)) 56px;border-radius:0 0 30px 30px}body.login-screen header h1{font-size:23px;line-height:1.4;color:#fff;margin:0 0 5px}body.login-screen header span{font-size:12px;color:#b1c6be}body.login-screen main{width:100%;max-width:480px;flex:1;margin:-30px auto 0;padding:0 18px 30px;position:relative}body.login-screen #context{display:none}.login-card{background:white;border:1px solid #e3e9e6;border-radius:30px;overflow:hidden;box-shadow:0 16px 36px #173d3210}.login-intro{padding:27px 25px 24px;border-bottom:1px solid #e9eeeb}.login-intro h2{font-size:28px;letter-spacing:-1px;margin:0 0 12px;font-weight:800}.login-intro h2 span{color:#348567}.login-intro p{margin:0;color:#6d7e76;font-size:14px;line-height:1.9}.login-intro b{color:#1c2e25}.login-form{padding:12px 25px 25px}.login-form label{font-weight:650;color:#697c72;font-size:14px;margin:18px 0 9px}.login-input{position:relative;display:flex;align-items:center;background:#f7f9f8;border:1.5px solid #e5ece8;border-radius:19px;transition:border-color .15s,box-shadow .15s}.login-input:focus-within{background:white;border-color:#4bc38b;box-shadow:0 0 0 4px #4bc38b16}.login-input .field-icon{position:absolute;left:17px;width:20px;height:20px;color:#94a59d;pointer-events:none}.login-input:focus-within .field-icon{color:#37a475}.login-input input{width:100%;border:0;background:transparent;border-radius:18px;padding:19px 48px 19px 48px;color:#182923;font-size:17px;outline:none;min-width:0}.login-input input::placeholder{color:#b4c0ba}.login-input .password-toggle{position:absolute;right:5px;top:50%;transform:translateY(-50%);margin:0;width:44px;height:44px;padding:11px;border:0;border-radius:12px;background:transparent;color:#8fa198;display:flex;align-items:center;justify-content:center}.password-toggle svg{width:21px;height:21px}.password-toggle:focus-visible,.login-form button:focus-visible{outline:2px solid #328769;outline-offset:3px}.login-help{font-size:12px;color:#93a39a;line-height:1.8;margin:15px 0 28px}.login-form .login-submit{background:linear-gradient(115deg,#56bf92,#439f7c);border-radius:18px;padding:18px;margin:10px 0 0;box-shadow:0 12px 22px #3da77e25;border-top:2px solid #ffffff55;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}.login-submit svg{width:20px;height:20px}.login-links{display:flex;gap:12px;margin-top:12px}.login-links button{margin:0;background:#f3f6f4;color:#1b2e24;border-radius:17px;padding:16px;font-size:16px}.login-screen footer{font-size:11px;color:#95a69b;padding:20px 16px 26px}.login-screen #message:not(:empty){position:fixed;bottom:26px;left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100vw - 40px);padding:13px 22px;margin:0;background:#213f33;color:white;border-radius:22px;box-shadow:0 12px 30px #193e3226;z-index:20;font-size:14px;text-align:center}.login-screen #message:empty{display:none}@media(max-width:360px){.login-intro,.login-form{padding-left:20px;padding-right:20px}body.login-screen header h1{font-size:21px}}
.login-select select{border:0;background:transparent;color:#182923;padding:19px 32px 19px 48px;border-radius:18px;font-size:15px;min-width:0;outline:none}.login-select select:focus-visible{outline:2px solid #4bc38b;outline-offset:2px}.login-form input:not([type="password"]){scroll-margin-top:24px}
</style></head><body><header><h1>交直流一体化实训系统</h1><span>连接设备，轻松充电</span></header><main><p id="context"></p><div id="view"></div><p id="message" role="status" aria-live="polite"></p></main><footer>充电教学与实训系统 · 客户账号版</footer><script>
'use strict';
const query=new URLSearchParams(location.search);
const pile=query.get('pile_no')||'';const gun=query.get('gun_no')||'1';
const valid=/^\d{14}$/.test(pile)&&/^([1-9]|[1-9]\d)$/.test(gun);
const view=document.getElementById('view'),message=document.getElementById('message');
document.getElementById('context').textContent=valid?`当前设备：${pile} / ${gun}号枪`:'未获取有效设备信息，请扫描带桩号和枪号的二维码。';
let user='',page='login',order=null,device=null,wallet=null,orders=[],busy=false,polling=false,reserveAmount='100';
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const field=(name,label,type='text',extra='')=>`<label for="${name}">${label}</label><input id="${name}" name="${name}" type="${type}" required ${extra}>`;
function show(p){page=p;message.textContent='';render();if(user&&['device','charging','orders','wallet'].includes(p))refresh();}
function render(){
 document.body?.classList.toggle('login-screen',['login','register','recover'].includes(page));
 document.body?.classList.toggle('charge-screen',page==='charging'&&order?.status==='charging');
 if(['login','register','recover'].includes(page)){
 view.innerHTML=loginMarkup(page);
 const passwordFields=page==='login'?['password']:page==='register'?['password','confirm']:['newpassword','confirm'];
 for(const id of passwordFields){const toggle=document.getElementById(id==='password'&&page==='login'?'togglePassword':'toggle-'+id);toggle.onclick=()=>{const input=document.getElementById(id),visible=input.type==='password';input.type=visible?'text':'password';toggle.setAttribute('aria-pressed',String(visible));toggle.setAttribute('aria-label',visible?'隐藏密码':'显示密码');toggle.innerHTML=visible?loginIcon('eyeOff'):loginIcon('eye');};}
 document.getElementById('auth').onsubmit=async e=>{
 e.preventDefault();const form=e.target,f=new FormData(form),current=page,pwd=f.get('password')||f.get('newpassword');
 if(current!=='login'&&pwd!==f.get('confirm')){message.textContent='两次输入的密码不一致';return;}
 const submit=form.querySelector('button[type="submit"]');if(submit.disabled)return;submit.disabled=true;submit.textContent='正在处理…';
 const payload={username:f.get('account'),password:pwd,security_question_id:f.get('question'),security_answer:f.get('answer')};
 try{
 if(current==='recover'){
 const proof=await api('/recovery/verify',payload);
 await api('/recovery/reset',{reset_token:proof.reset_token,new_password:pwd});
 user='';order=null;wallet=null;device=null;orders=[];form.reset();show('login');message.textContent='密码已重置，请使用新密码登录。';return;
 }
 const data=await api('/'+current,payload);user=data.user.username;form.reset();show('device');
 }catch(error){message.textContent=error.message;}finally{if(form.isConnected){submit.disabled=false;submit.innerHTML=current==='login'?loginIcon('enter')+'登录':current==='register'?'注册并登录':'验证并重置密码';}}
 };
 }else if(page==='device'){
 const state=device?.availability||'loading';
 const labels={loading:'正在查询设备',idle:'空闲',occupied:'该枪正在使用中',offline:'设备离线',fault:'设备故障',unknown:'等待最新设备数据',mine:'本人订单',account_busy:'您有未结束的充电订单'};
 const plugged=device?.latest?.gun_plugged===1;
 const rates=device?.billing?.rates;
 view.innerHTML=`<section class="card"><h2>确认充电设备</h2><p>你好，${escape(user)}</p>${walletInfo()}<dl><dt>桩编号</dt><dd>${escape(pile||'未识别')}</dd><dt>枪号</dt><dd>${escape(gun)}</dd><dt>设备状态</dt><dd>${escape(valid?labels[state]:'请从桩二维码进入')}</dd><dt>插枪状态</dt><dd>${state==='idle'?(plugged?'已插枪':'未插枪'):'—'}</dd></dl>${device?.message?`<p role="status">${escape(device.message)}</p>`:''}${device?.active_order?`<p>当前订单：${escape(device.active_order.pile_no)} / ${escape(device.active_order.gun_no)}号枪</p><button id="currentOrder">查看当前充电</button>`:''}${rates?'<p>后台计费模型（元/kWh）</p>'+Object.entries(rates).map(([key,v])=>`<p>${({jian:'尖',feng:'峰',ping:'平',gu:'谷'})[key]}：电费 ${Number(v.electricity).toFixed(2)} + 服务费 ${Number(v.service).toFixed(2)}</p>`).join(''):''}<p>每轮充电结束后，必须先拔枪再重新插枪，才能开始下一轮。<br>预留金额由你设置，仅冻结额度，结束后按最终账单扣费，多余预留自动释放，启动失败不扣费。</p><label for="reserveAmount">预留金额（元）</label><input id="reserveAmount" type="number" min="0.01" max="${wallet?Math.min(wallet.available_fen,4294967295)/100:100}" step="0.01" value="${escape(reserveAmount)}" inputmode="decimal" required><p><small>默认100元，不能超过可用余额。</small></p><button id="start" ${!valid||state!=='idle'||!plugged||busy||!wallet||wallet.available_fen<=0?'disabled':''}>确认并启动充电</button><button class="secondary" id="refreshDevice" ${busy?'disabled':''}>刷新状态</button><button class="secondary" data-page="orders">我的订单</button><button class="secondary" data-page="wallet">钱包</button><button class="secondary" id="logout">退出登录</button></section>`;
 document.getElementById('refreshDevice').onclick=()=>refresh();
 if(device?.active_order)document.getElementById('currentOrder').onclick=()=>{order=device.active_order;show('charging');};
 document.getElementById('reserveAmount').oninput=e=>{reserveAmount=e.target.value;};
 document.getElementById('start').onclick=()=>{const input=document.getElementById('reserveAmount');if(!input.reportValidity())return;reserveAmount=input.value;action(async()=>{const d=await api('/orders',{pile_no:pile,gun_no:Number(gun),reserve_amount:reserveAmount});order=d.order;page='charging';});};
 logoutButton();
 }else if(page==='charging'){
 if(!order){view.innerHTML='<section class="card">正在恢复订单…</section>';return;}
 const d=order.latest||{},tx=order.transaction;
 const failed=order.status==='failed';
 const connection=order.device_online===true?'在线':order.device_online===false?'离线':'连接状态待更新';
 const deviceLabel=({idle:'空闲',charging:'充电中',offline:'离线',fault:'故障',unknown:'等待设备状态更新'})[order.device_state]||'等待设备状态更新';
 const names={starting:'正在启动',charging:'充电中',stopping:'正在停止',ending:'等待最终交易记录',unknown:'结果待确认',finished:'充电结束',failed:'启动失败'};
 const energy=tx?Number(tx.total_energy)/10000:(d.energy===undefined?null:Number(d.energy)/10000);
 const amount=tx?Math.floor((Number(tx.total_amount)+50)/100)/100:(d.amount===undefined?null:Math.floor((Number(d.amount)+50)/100)/100);
 view.innerHTML=order.status==='charging'?chargingDashboard(order):`<section class="card"><h2>${escape(names[order.status]||order.status)}</h2><p>${escape(order.pile_no)} / ${order.gun_no}号枪</p><p role="status" style="color:${order.status==='failed'?'#b74444':'inherit'}">${escape(order.note||'')}</p>${failed?'<p>本次启动失败，未扣费。请处理上述问题后点击“重新尝试充电”。</p>':''}<div class="metrics"><div class="metric">电量 / kWh<strong>${energy===null?'—':energy.toFixed(4)}</strong></div><div class="metric">设备金额 / 元<strong>${amount===null?'—':amount.toFixed(2)}</strong></div><div class="metric">充电时间 / 分钟<strong>${d.charge_time??'—'}</strong></div><div class="metric">SOC / %<strong>${d.soc??'—'}</strong></div></div><p>设备连接：${connection} · 设备状态：${escape(deviceLabel)}</p><p><small>${failed?'本次未成功启动，暂无本次充电数据。':'空白数据表示尚未取得匹配订单的最新报文。'}</small></p><dl><dt>订单编号</dt><dd>${escape(order.serial_no||order.id||'—')}</dd><dt>创建时间</dt><dd>${orderTime(order.created_at)}</dd>${tx?`<dt>开始时间</dt><dd>${escape(tx.start_time||'—')}</dd><dt>结束时间</dt><dd>${escape(tx.end_time||'—')}</dd>`:''}</dl>${tariffDetails(tx)}${walletInfo()}${failed?'':`<p>${order.settlement_status==='settled'?'已扣费：'+money(order.settled_fen)+' 元':order.settlement_status==='review'?'账单金额变更待核查，未重复扣费':order.settlement_status==='not_charged'?'启动失败，未扣费':order.settlement_status==='legacy'?'历史订单不追扣余额':'等待最终账单后扣费'}。</p>`}${failed?`<button id="retry" ${busy?'disabled':''}>重新尝试充电</button>`:''}${order.status==='charging'?`<button class="danger" id="stop" ${busy||order.status!=='charging'||order.device_state!=='charging'?'disabled':''}>停止本人充电</button>`:''}<button class="secondary" data-page="orders">我的订单</button><button class="secondary" data-page="wallet">钱包</button><button class="secondary" data-page="device">返回当前扫码设备</button></section>`;
 if(failed)document.getElementById('retry').onclick=()=>{if(busy)return;if(order.pile_no!==pile||Number(order.gun_no)!==Number(gun)){location.href='/?pile_no='+encodeURIComponent(order.pile_no)+'&gun_no='+encodeURIComponent(order.gun_no);return;}device=null;show('device');};
 if(order.status==='charging')document.getElementById('stop').onclick=()=>action(async()=>{const d=await api('/orders/'+order.id+'/stop',{});order=d.order;});
 }else if(page==='wallet'){
 view.innerHTML=`<section class="card"><h2>钱包</h2>${walletInfo()}<p>余额仅用于教学模拟，不可提现。充值或扣费请联系管理员。开始充电预留额度；最终账单到账后结算。</p>${wallet?.ledger?.length?wallet.ledger.map(entry=>`<p>${escape(ledgerName(entry.kind))} · ${entry.delta_fen>=0?'+':''}${money(entry.delta_fen)} 元<br><small>${escape(new Date(entry.created*1000).toLocaleString())} · ${escape(entry.note)}<br>变动后余额：${money(entry.after_fen)} 元</small></p>`).join(''):'<p>暂无流水</p>'}<button class="secondary" data-page="device">返回设备</button><button class="secondary" data-page="orders">我的订单</button><button class="secondary" id="logout">退出登录</button></section>`;logoutButton();
 }else{
 view.innerHTML=`<section class="card"><h2>我的订单</h2>${walletInfo()}${orders.length?`<p class="order-hint">点击任意一行查看订单详情 · 最近${orders.length}笔</p><table class="order-table"><thead><tr><th scope="col">时间</th><th scope="col">设备</th><th scope="col">状态</th><th scope="col">费用/元</th></tr></thead><tbody>${orders.map(o=>`<tr tabindex="0" data-order="${escape(o.id)}" aria-label="查看${escape(o.pile_no)} ${escape(o.gun_no)}号枪订单详情"><td>${orderTime(o.created_at)}</td><td>${escape(o.pile_no)}<small>${escape(o.gun_no)}号枪</small></td><td><span class="order-status ${o.status==='failed'?'failed':''}">${escape(({starting:'正在启动',charging:'充电中',stopping:'正在停止',unknown:'结果待确认',ending:'等待账单',finished:'已结束',failed:'启动失败'})[o.status]||o.status)}</span><small>${escape(tariffSummary(o.transaction))}</small></td><td>${orderCost(o)}</td></tr>`).join('')}</tbody></table>`:'<p>暂无订单</p>'}<button class="secondary" data-page="device">返回当前扫码设备</button><button class="secondary" id="logout">退出登录</button></section>`;
 view.querySelectorAll('[data-order]').forEach(row=>{const open=()=>{order=orders.find(o=>o.id===row.dataset.order);show('charging');};row.onclick=open;row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open();}};});logoutButton();
 }
 view.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));
}
function loginIcon(kind){const shapes={user:'<circle cx="12" cy="8" r="3.5"/><path d="M4.5 21v-2a7.5 7.5 0 0 1 15 0v2"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/>',eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/>',eyeOff:'<path d="m3 3 18 18M10 5a13 13 0 0 1 12 7 18 18 0 0 1-4 4M6 6a17 17 0 0 0-4 6s3.5 7 10 7a13 13 0 0 0 5-1M10 10a3 3 0 0 0 4 4"/>',question:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3h.01"/>',shield:'<path d="m12 3 8 3v6c0 5-8 9-8 9S4 17 4 12V6l8-3Z"/><path d="m8 12 3 3 5-6"/>',enter:'<path d="M14 4h5v16h-5M3 12h12m-5-5 5 5-5 5"/>'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${shapes[kind]||''}</svg>`;}
function loginMarkup(mode='login'){if(mode!=='login')return accountMarkup(mode);return `<section class="login-card"><div class="login-intro"><h2>欢迎<span>登录</span></h2><p>登录后继续处理刚扫描的设备。<b>新注册账号赠送1000元余额。</b></p></div><form id="auth" class="login-form"><label for="account">账号</label><div class="login-input"><span class="field-icon">${loginIcon('user')}</span><input id="account" name="account" type="text" required minlength="4" maxlength="32" autocomplete="username" pattern="[A-Za-z0-9_]{4,32}" placeholder="请输入账号" autocapitalize="none" spellcheck="false"></div><label for="password">密码</label><div class="login-input"><span class="field-icon">${loginIcon('lock')}</span><input id="password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="current-password" placeholder="请输入密码"><button id="togglePassword" type="button" class="password-toggle" aria-label="显示密码" aria-pressed="false">${loginIcon('eye')}</button></div><p class="login-help">ⓘ 账号为4–32位字母、数字或下划线；密码至少8位。</p><button type="submit" class="login-submit">${loginIcon('enter')}登录</button><nav class="login-links" aria-label="账号服务"><button type="button" data-page="register">注册</button><button type="button" data-page="recover">忘记密码</button></nav></form></section>`;}
function accountField(id,label,{secret=false,placeholder='',attrs='',icon='lock',toggle=true}={}){return `<label for="${id}">${label}</label><div class="login-input"><span class="field-icon">${loginIcon(icon)}</span><input id="${id}" name="${id}" type="${secret?'password':'text'}" required placeholder="${placeholder}" ${attrs}>${secret&&toggle?`<button id="toggle-${id}" type="button" class="password-toggle" aria-label="显示密码" aria-pressed="false">${loginIcon('eye')}</button>`:''}</div>`;}
function accountMarkup(mode){
 const register=mode==='register',account=accountField('account','账号',{icon:'user',placeholder:'请输入账号',attrs:'minlength="4" maxlength="32" autocomplete="username" pattern="[A-Za-z0-9_]{4,32}" autocapitalize="none" spellcheck="false"'});
 const pwd=(id,label,placeholder)=>accountField(id,label,{secret:true,placeholder,attrs:'minlength="8" maxlength="128" autocomplete="new-password"'});
 const security=`<label for="question">安全问题</label><div class="login-input login-select"><span class="field-icon">${loginIcon('question')}</span><select id="question" name="question" required><option value="movie">你最喜欢的电影是哪一部？</option><option value="book">你最喜欢的一本书是什么？</option><option value="color">你最喜欢的颜色是什么？</option><option value="sport">您最喜欢的运动是什么？</option><option value="disliked_food">你最讨厌的食物是什么？</option><option value="first_phone_last4">你的第一个手机号码后四位是多少？</option><option value="respected_person">您最尊敬的人是谁？</option><option value="favorite_number">您最喜欢的数字是多少？</option></select></div>${accountField('answer','安全答案',{secret:true,toggle:false,icon:'shield',placeholder:'请输入安全答案',attrs:'minlength="1" maxlength="128" autocomplete="off"'})}`;
 return `<section class="login-card"><div class="login-intro"><h2>${register?'创建<span>账号</span>':'找回<span>密码</span>'}</h2><p>${register?'登录后继续处理刚扫描的设备。<b>新注册账号赠送1000元余额。</b>':'请填写注册账号和密保信息，验证后设置新密码。'}</p></div><form id="auth" class="login-form">${account}${register?pwd('password','密码','请输入密码（至少8位）')+pwd('confirm','确认密码','请再次输入密码'):''}${security}${register?'':pwd('newpassword','新密码','请输入新密码（至少8位）')+pwd('confirm','确认新密码','请再次输入新密码')}<p class="login-help">ⓘ 账号为4–32位字母、数字或下划线；密码至少8位。${register?'请牢记安全问题及答案。':''}</p><button type="submit" class="login-submit">${loginIcon(register?'user':'shield')}${register?'注册并登录':'验证并重置密码'}</button><nav class="login-links" aria-label="账号服务"><button type="button" data-page="login">登录</button><button type="button" data-page="${register?'recover':'register'}">${register?'忘记密码':'注册'}</button></nav></form></section>`;
}
function logoutButton(){document.getElementById('logout').onclick=()=>action(async()=>{await api('/logout',{});user='';order=null;device=null;wallet=null;orders=[];page='login';});}
async function action(fn){if(busy)return;busy=true;message.textContent='正在处理，请等待设备回复…';render();try{await fn();if(user){const w=await api('/wallet');wallet=w.wallet;}message.textContent='';}catch(error){message.textContent=error.message;}finally{busy=false;render();}}
function money(fen){return (Number(fen||0)/100).toFixed(2);}
const chargeSamples=new Map();
function liveNumber(d,key,scale=1,offset=0){const n=Number(d[key]);return d[key]==null||!Number.isFinite(n)||n<0||n>=(['soc','gun_temp','batt_max_temp'].includes(key)?255:65535)?null:n/scale+offset;}
function chargeCurve(o){
 const d=o.latest||{},v=liveNumber(d,'out_voltage',10),a=liveNumber(d,'out_current',10),t=Number(d.updated_at);
 let points=chargeSamples.get(o.id)||[];
 if(v!==null&&a!==null&&Number.isFinite(t)&&t>0&&(!points.length||t>points[points.length-1].t)){points.push({t,v,a});points=points.slice(-180);chargeSamples.set(o.id,points);if(chargeSamples.size>10)chargeSamples.delete(chargeSamples.keys().next().value);}
 if(points.length<2)return '<div class="chart-empty">等待更多实时数据后显示曲线</div><p>仅记录本页收到的数据，刷新页面后重新采集。</p>';
 const vmax=Math.max(1,...points.map(p=>p.v))*1.1,amax=Math.max(1,...points.map(p=>p.a))*1.1,start=points[0].t,span=points[points.length-1].t-start;
 const path=(key,max)=>points.map((p,i)=>(i?'L':'M')+(34+(p.t-start)/span*282).toFixed(1)+','+(132-p[key]/max*108).toFixed(1)).join(' ');
 return `<svg class="charge-chart" viewBox="0 0 350 175" role="img" aria-label="输出电压与电流曲线，电压看左轴，电流看右轴"><path d="M34 24V132H316M34 78H316M34 24H316" fill="none" stroke="#e8eeee"/><text x="1" y="25" font-size="10" fill="#4a7cf0">${vmax.toFixed(0)}V</text><text x="319" y="25" font-size="10" fill="#42b59d">${amax.toFixed(0)}A</text><text x="8" y="135" font-size="10" fill="#8b9ba7">0</text><text x="321" y="135" font-size="10" fill="#8b9ba7">0</text><path d="${path('v',vmax)}" fill="none" stroke="#4a7cf0" stroke-width="2.5"/><path d="${path('a',amax)}" fill="none" stroke="#42b59d" stroke-width="2.5"/><text x="34" y="151" font-size="10" fill="#8b9ba7">${escape(new Date(start*1000).toLocaleTimeString())}</text><text x="316" y="151" text-anchor="end" font-size="10" fill="#8b9ba7">${escape(new Date(points[points.length-1].t*1000).toLocaleTimeString())}</text><text x="76" y="171" font-size="11" fill="#4a7cf0">— 电压(V) 左轴</text><text x="191" y="171" font-size="11" fill="#42b59d">— 电流(A) 右轴</text></svg><p>本页采集 · 最近${points.length}个采样点 · 刷新后重新采集</p>`;
}
function chargingDashboard(o){
 const d=o.latest||{},fmt=(v,n=1)=>v===null?'—':v.toFixed(n),vol=liveNumber(d,'out_voltage',10),cur=liveNumber(d,'out_current',10),rawSoc=liveNumber(d,'soc'),soc=rawSoc!==null&&rawSoc<=100?rawSoc:null;
 const kwh=d.energy==null?null:Number(d.energy)/10000,amount=d.amount==null?null:Math.floor((Number(d.amount)+50)/100)/100;
 const tile=(value,unit,label)=>`<div class="charge-tile"><strong>${value}</strong><span>${unit}</span><small>${label}</small></div>`;
 const rate=o.billing?.current,rateText=rate?`${escape(rate.label)} · 电费 ${Number(rate.electricity).toFixed(2)}元/度 + 服务费 ${Number(rate.service).toFixed(2)}元/度`:'费率信息待更新';
 const connected=o.device_online===true?'在线':o.device_online===false?'离线':'连接状态待更新';
 return `<section class="charge-head"><h2>充电中</h2><p>桩：${escape(o.pile_no)} · ${escape(o.gun_no)}号枪</p><p>流水：${escape(o.serial_no||o.id)}</p></section><aside class="charge-safety"><strong>⚠ 安全提示</strong>• 充电过程中请勿拔出充电枪。<br>• 紧急情况请按设备上的急停按钮。<br>• 停止充电后，按设备要求拔枪。</aside>${o.note?`<p class="charge-note" role="status">${escape(o.note)}</p>`:''}<div class="soc-wrap"><svg viewBox="0 0 200 200" aria-hidden="true"><circle class="soc-track" cx="100" cy="100" r="85"/><circle class="soc-progress" cx="100" cy="100" r="85" stroke-dasharray="534.07" stroke-dashoffset="${(534.07*(1-(soc??0)/100)).toFixed(2)}"/></svg><div class="soc-value"><strong>${soc===null?'—':soc.toFixed(0)}${soc===null?'':'%'}</strong><span>电池 SOC</span></div></div><div class="charge-rate"><b>平台参考费率</b>${rateText}</div><div class="charge-grid">${tile(fmt(vol),'V','输出电压')}${tile(fmt(cur),'A','输出电流')}${tile(fmt(vol===null||cur===null?null:vol*cur/1000,2),'kW','输出功率')}${tile(fmt(liveNumber(d,'batt_max_temp',1,-50),0),'℃','电池最高温度')}${tile(fmt(liveNumber(d,'gun_temp',1,-50),0),'℃','枪线温度')}${tile(fmt(liveNumber(d,'charge_time'),0),'min','已充时间')}${tile(fmt(liveNumber(d,'remain_time'),0),'min','预计剩余')}${tile(fmt(kwh,4),'kWh','已充度数')}${tile(fmt(amount,2),'元','累计费用')}</div><section class="charge-panel"><h3>充电曲线</h3><p>设备实时数据 · 0x13</p>${chargeCurve(o)}</section><section class="charge-panel"><dl><dt>充电度数</dt><dd>${fmt(kwh,4)} kWh</dd><dt>电费</dt><dd>—</dd><dt>服务费</dt><dd>—</dd></dl><div class="charge-total"><span>已充金额</span><strong>${fmt(amount,2)} 元</strong></div><p>设备未单独提供电费、服务费，暂不拆分；结束后以最终账单结算。</p></section><button class="charge-stop" id="stop" ${busy||o.device_state!=='charging'?'disabled':''}>${busy?'正在处理…':'停止充电'}</button><section class="charge-panel charge-meta"><p>设备连接：${connected} · ${escape(o.device_state==='charging'?'充电中':'等待设备状态更新')}</p><p>${d.updated_at?'数据更新：'+escape(new Date(d.updated_at*1000).toLocaleTimeString()):'等待匹配本订单的最新数据；空白不代表数值为零。'}</p>${walletInfo()}<details><summary>订单信息</summary><p>订单编号：${escape(o.serial_no||o.id)}</p><p>创建时间：${orderTime(o.created_at)}</p></details></section><nav class="charge-nav"><button class="secondary" data-page="orders">我的订单</button><button class="secondary" data-page="wallet">钱包</button><button class="secondary" data-page="device">返回设备</button></nav>`;
}
const tariffKinds=[['jian','尖'],['feng','峰'],['ping','平'],['gu','谷']];
function tariffNumber(tx,key,scale,digits){return tx&&tx[key]!=null&&Number.isFinite(Number(tx[key]))?(Number(tx[key])/scale).toFixed(digits):'—';}
function tariffSummary(tx){if(!tx)return '计费类型待账单确认';if(!tariffKinds.some(([key])=>tx[key+'_energy']!=null||tx[key+'_amount']!=null))return '账单缺少分时数据';const used=tariffKinds.filter(([key])=>Number(tx[key+'_energy'])>0||Number(tx[key+'_amount'])>0);return used.length?used.map(([key,label])=>label+' '+tariffNumber(tx,key+'_price',100000,2)+'元/度').join('、'):'账单无分时用量';}
function tariffDetails(tx){if(!tx)return '<p class="order-hint">分时计费明细待最终账单确认。</p>';return `<h3>分时计费明细</h3><p class="order-hint">单价含电费及服务费，以设备上传账单为准。</p><table class="order-table"><thead><tr><th scope="col">类型</th><th scope="col">单价<br>元/度</th><th scope="col">电量<br>kWh</th><th scope="col">费用<br>元</th></tr></thead><tbody>${tariffKinds.map(([key,label])=>`<tr><td>${label}</td><td>${tariffNumber(tx,key+'_price',100000,2)}</td><td>${tariffNumber(tx,key+'_energy',10000,4)}</td><td>${tx[key+'_amount']==null?'—':money(Math.floor((Number(tx[key+'_amount'])+50)/100))}</td></tr>`).join('')}</tbody></table><p class="order-hint">各时段费用单独四舍五入，与账单总额可能存在分位差异；余额按最终账单总额结算。</p>`;}
function orderTime(seconds){const date=new Date(Number(seconds)*1000);if(!seconds||Number.isNaN(date.getTime()))return '—';const pad=n=>String(n).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}<small>${pad(date.getHours())}:${pad(date.getMinutes())}</small>`;}
function orderCost(o){if(o.settlement_status==='settled'&&o.settled_fen!=null)return money(o.settled_fen);if(o.settlement_status==='not_charged')return '0.00';if(o.transaction?.total_amount!=null)return money(Math.floor((Number(o.transaction.total_amount)+50)/100));return '—';}
function walletInfo(){return wallet?`<p><b>余额：${money(wallet.balance_fen)} 元</b><br>可用：${money(wallet.available_fen)} 元 · 预留：${money(wallet.reserved_fen)} 元</p>`:'<p>正在读取余额…</p>';}
function ledgerName(kind){return ({bonus:'赠送余额',admin_credit:'管理员充值',admin_debit:'管理员扣费',charging:'充电扣费'})[kind]||kind;}
async function refresh(){
 if(!user||busy||polling)return;polling=true;const current=page;
 try{
 const w=await api('/wallet');if(!user)return;wallet=w.wallet;
 if(page==='device'&&valid){const d=await api('/device?pile_no='+encodeURIComponent(pile)+'&gun_no='+encodeURIComponent(gun));if(page!==current)return;device=d;if(d.availability==='mine'){order=d.order;page='charging';}}
 else if(page==='charging'&&order){const d=await api('/orders/'+order.id);if(page!==current)return;order=d.order;}
 else if(page==='orders'){const d=await api('/orders');if(page!==current)return;orders=d.orders;}
 if(!busy&&!(page==='device'&&document.activeElement?.id==='reserveAmount'))render();
 }catch(error){if(error.status===401){user='';order=null;wallet=null;device=null;orders=[];page='login';render();}message.textContent=error.message;}finally{polling=false;}
}

async function api(path,payload){
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),100000);
 try{
 const response=await fetch('/api/customer'+path,{method:payload===undefined?'GET':'POST',credentials:'same-origin',headers:payload===undefined?{}:{'Content-Type':'application/json','X-Customer-Request':'1'},body:payload===undefined?undefined:JSON.stringify(payload),signal:controller.signal});
 const data=await response.json();if(!response.ok){const error=new Error(data.error||'请求失败');error.status=response.status;throw error;}return data;
 }catch(error){if(error.name==='AbortError')throw new Error('请求超时，请稍后重试');if(error instanceof SyntaxError||error instanceof TypeError)throw new Error('客户接口不可用，请确认已启动新版客户服务');throw error;}finally{clearTimeout(timeout);}
}
async function init(){
 render();
 try{await api('/config');}catch(error){message.textContent=error.message;return;}
 try{const data=await api('/me');user=data.user.username;show('device');}catch(error){if(error.message!=='请先登录')message.textContent=error.message;}
}
init();
setInterval(()=>{if(!document.hidden)refresh();},5000);
</script></body></html>
